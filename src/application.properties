# =====================================================
# Configuración de la Aplicación - Validador ACES
# =====================================================

# =====================================================
# CONFIGURACIÓN DE VALIDACIÓN
# =====================================================

# Nivel de strictness: LENIENT, NORMAL, STRICT
validation.strictness=NORMAL

# Case-sensitive en validaciones de enum
validation.case-sensitive=false

# Máximo número de errores antes de parar
validation.max-errors=1000

# Validadores activos (separados por coma)
validation.active-validators=attribute,range,enum,date-format

# =====================================================
# CONFIGURACIÓN DE CACHÉ
# =====================================================

# Habilitar caché de resultados
cache.enabled=true

# Tamaño máximo de caché
cache.max-size=100

# Tiempo de expiración en minutos (0 = sin expiración)
cache.expiration-minutes=60

# =====================================================
# CONFIGURACIÓN DE REPORTE
# =====================================================

# Incluir atributos válidos en reporte
report.include-valid-attributes=false

# Formato de fecha en reportes
report.date-format=yyyy-MM-dd HH:mm:ss

# Mostrar en reporte: estadísticas por ProductLine
report.include-statistics=true

# Mostrar en reporte: historial de auditoría
report.include-audit=false

# =====================================================
# CONFIGURACIÓN DE INTERFAZ GRÁFICA
# =====================================================

# Recordar último directorio usado
gui.remember-last-path=true

# Mostrar panel de estadísticas
gui.show-statistics=true

# Mostrar panel de auditoría
gui.show-audit=false

# Tamaño de fuente en GUI (puntos)
gui.font-size=12

# Tema: LIGHT, DARK, SYSTEM
gui.theme=SYSTEM

# Ancho inicial de ventana principal
gui.window.width=1024

# Alto inicial de ventana principal
gui.window.height=768

# =====================================================
# CONFIGURACIÓN DE AUDITORÍA
# =====================================================

# Habilitar auditoría
audit.enabled=true

# Nivel de detalle: BASIC, DETAILED, FULL
audit.level=DETAILED

# Guardar auditoría en archivo
audit.save-to-file=true

# Archivo de auditoría (ruta relativa a carpeta de aplicación)
audit.file=audit.log

# =====================================================
# CONFIGURACIÓN DE LOGGING
# =====================================================

# Nivel de logging: SEVERE, WARNING, INFO, FINE, FINER, FINEST
logging.level=INFO

# Archivo de log
logging.file=validador-aces.log

# Máximo tamaño de archivo log en MB
logging.max-file-size=10

# =====================================================
# CONFIGURACIÓN DE ARCHIVOS
# =====================================================

# Extensiones de archivo permitidas para catálogos
file.catalog.extensions=xlsx

# Extensiones de archivo permitidas para aplicaciones
file.application.extensions=xlsx

# Tamaño máximo de archivo en MB
file.max-size-mb=500

# =====================================================
# CONFIGURACIÓN DE EXPORTACIÓN
# =====================================================

# Incluir hoja de configuración en reporte Excel
export.include-config=true

# Incluir hoja de auditoría en reporte Excel
export.include-audit=false

# Nombre por defecto para reportes exportados
export.default-filename-pattern=reporte_validacion_{timestamp}.xlsx

# =====================================================
# CONFIGURACIÓN DE BASE DE DATOS (Futuro)
# =====================================================

# db.enabled=false
# db.url=jdbc:mysql://localhost:3306/aces
# db.user=aces_user
# db.password=

# =====================================================
# CONFIGURACIÓN DE API (Futuro)
# =====================================================

# api.enabled=false
# api.port=8080
# api.base-path=/api/v1

# =====================================================
# CONFIGURACIÓN AVANZADA
# =====================================================

# Número máximo de threads para procesamiento paralelo
advanced.max-threads=4

# Timeout para operaciones en milisegundos
advanced.operation-timeout-ms=30000

# Usar compresión en reportes
advanced.compress-reports=false

# Modo debug
advanced.debug-mode=false

# =====================================================
# INFORMACIÓN DE LA APLICACIÓN
# =====================================================

app.name=Validador de Atributos ACES
app.version=1.0.0
app.vendor=ACES Team
app.description=Herramienta para validar atributos de productos contra catálogos maestros ACES

